# Automatically create GitHub releases with build artifacts
# for every push to version branches

name: Release

on:
  push:
    branches:
      - mc26.2
      - mc26.1
      - mc1.21-1.21.8
      - mc1.21.9-1.21.11

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-24.04
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
      minecraft_version: ${{ steps.version.outputs.minecraft_version }}
      minecraft_range: ${{ steps.version.outputs.minecraft_range }}
      minecraft_range_neoforge: ${{ steps.version.outputs.minecraft_range_neoforge }}
      branch_name: ${{ steps.version.outputs.branch_name }}
      java_version: ${{ steps.version.outputs.java_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version information
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
          MC_RANGE=$(grep '^minecraft_range=' gradle.properties | cut -d'=' -f2)
          MC_RANGE_NEO=$(grep '^minecraft_range_neoforge=' gradle.properties | cut -d'=' -f2)
          # Branches ohne eigene NeoForge-Range nutzen weiterhin die gemeinsame
          [ -z "$MC_RANGE_NEO" ] && MC_RANGE_NEO="$MC_RANGE"
          echo "minecraft_range=$MC_RANGE" >> $GITHUB_OUTPUT
          echo "minecraft_range_neoforge=$MC_RANGE_NEO" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

          # Detect Java version from the build files; on the Architectury-template
          # branches options.release lives in the ROOT build.gradle, not fabric/.
          JAVA_VER=$(grep -h 'options.release' build.gradle fabric/build.gradle common/build.gradle neoforge/build.gradle 2>/dev/null | grep -oP '\d+' | head -1)
          JAVA_VER=${JAVA_VER:-21}
          echo "java_version=$JAVA_VER" >> $GITHUB_OUTPUT

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.version.outputs.java_version }}
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.mod_version }}-${{ steps.version.outputs.branch_name }}
          path: |
            fabric/build/libs/
            neoforge/build/libs/
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.mod_version }}-${{ needs.build.outputs.branch_name }}
          path: artifacts/

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.mod_version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[.*\]/{flag=0} flag" CHANGELOG.md | sed '/^$/d')

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changelog entry available for this version."
          fi

          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Get commits since last release
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate release body
        run: |
          cat << 'RELEASE_BODY' > release_body.md
          ## What's New in v${{ needs.build.outputs.mod_version }}

          ${{ steps.changelog.outputs.changelog }}

          ## Compatibility

          - **Minecraft:** ${{ needs.build.outputs.minecraft_version }}
          - **Java:** ${{ needs.build.outputs.java_version }}+

          ## Build Artifacts

          - `shulkersorter-fabric-${{ needs.build.outputs.mod_version }}+mc${{ needs.build.outputs.minecraft_range }}.jar` - Fabric mod file (download this for Fabric)
          - `shulkersorter-neoforge-${{ needs.build.outputs.mod_version }}+mc${{ needs.build.outputs.minecraft_range_neoforge }}.jar` - NeoForge mod file (download this for NeoForge)
          - `*-sources.jar` - Source code

          ## Recent Commits

          ${{ steps.commits.outputs.commits }}

          ---

          **Installation:** Download the JAR for your mod loader and place it in your mods folder. On Fabric you also need Fabric API and Architectury API; on NeoForge you also need Architectury API.
          RELEASE_BODY

      - name: Create Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build.outputs.mod_version }}-${{ needs.build.outputs.branch_name }}
          name: ShulkerSorter v${{ needs.build.outputs.mod_version }} (MC ${{ needs.build.outputs.minecraft_version }})
          prerelease: false
          body_path: release_body.md
          files: |
            artifacts/fabric/build/libs/shulkersorter-*.jar
            artifacts/neoforge/build/libs/shulkersorter-*.jar
