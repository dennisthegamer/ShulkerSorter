plugins {
	id 'net.neoforged.moddev'
}

version = "${project.mod_version}+mc${project.minecraft_range}"
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge"
}

repositories {
	mavenCentral()

	maven {
		name = "NeoForged"
		url = "https://maven.neoforged.net/releases/"
	}

	// Architectury Maven for Architectury API
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}

	// Xander Maven for YACL
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
}

sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
			gameDirectory = file('run')
		}
	}

	mods {
		register('shulkersorter') {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Architectury API (required at runtime for events and networking)
	implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"

	// YACL for configuration screens (users install separately)
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"
	runtimeOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}-neoforge"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}
