# Automatically create GitHub releases with build artifacts
# for every push to version branches

name: Release

on:
  push:
    branches:
      - mc26.2
      - mc26.1
      - mc1.21-1.21.8
      - mc1.21.9-1.21.11

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-24.04
    outputs:
      mod_version: ${{ steps.version.outputs.mod_version }}
      minecraft_version: ${{ steps.version.outputs.minecraft_version }}
      branch_name: ${{ steps.version.outputs.branch_name }}
      java_version: ${{ steps.version.outputs.java_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version information
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

          # Detect Java version from build.gradle
          JAVA_VER=$(grep 'options.release' build.gradle | grep -oP '\d+')
          echo "java_version=$JAVA_VER" >> $GITHUB_OUTPUT

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.version.outputs.java_version }}
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.mod_version }}-${{ steps.version.outputs.branch_name }}
          path: build/libs/
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.mod_version }}-${{ needs.build.outputs.branch_name }}
          path: build/libs/

      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.mod_version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[.*\]/{flag=0} flag" CHANGELOG.md | sed '/^$/d')

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No changelog entry available for this version."
          fi

          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Get commits since last release
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo 'commits<<EOF'
            echo "$COMMITS"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Generate release body
        run: |
          cat << 'RELEASE_BODY' > release_body.md
          ## What's New in v${{ needs.build.outputs.mod_version }}

          ${{ steps.changelog.outputs.changelog }}

          ## Compatibility

          - **Minecraft:** ${{ needs.build.outputs.minecraft_version }}
          - **Java:** ${{ needs.build.outputs.java_version }}+

          ## Build Artifacts

          - `shulkersort-${{ needs.build.outputs.mod_version }}.jar` - Main mod file (download this)
          - `shulkersort-${{ needs.build.outputs.mod_version }}-sources.jar` - Source code

          ## Recent Commits

          ${{ steps.commits.outputs.commits }}

          ---

          **Installation:** Download the main JAR file and place it in your mods folder along with Fabric API.
          RELEASE_BODY

      - name: Create Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.build.outputs.mod_version }}-${{ needs.build.outputs.branch_name }}
          name: ShulkerSort v${{ needs.build.outputs.mod_version }} (MC ${{ needs.build.outputs.minecraft_version }})
          prerelease: false
          body_path: release_body.md
          files: |
            build/libs/shulkersort-*.jar
            build/libs/shulkersort-*-sources.jar
