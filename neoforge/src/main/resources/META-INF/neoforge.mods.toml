modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "shulkersorter"
version = "${version}"
displayName = "ShulkerSorter"
authors = "DennisTheGamer"
description = '''
Automatically sorts, merges and labels shulker boxes in your inventory by item category.
'''
logoFile = "assets/shulkersorter/icon.png"

[[dependencies.shulkersorter]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.6)"
ordering = "NONE"
side = "BOTH"

[[dependencies.shulkersorter]]
modId = "neoforge"
type = "required"
versionRange = "[21.0,21.6)"
ordering = "NONE"
side = "BOTH"

[[dependencies.shulkersorter]]
# Architectury tracks MC minors: 13.x=1.21/1.21.1, 14.x=1.21.2/3, 15.x=1.21.4,
# 16.x=1.21.5, 17.x=1.21.6-8 — the floor must match the OLDEST supported MC.
modId = "architectury"
type = "required"
versionRange = "[13.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.shulkersorter]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[3.7.0,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "shulkersorter.mixins.json"
