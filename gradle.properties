# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Minecraft
# Compatible with Minecraft 1.21 through 1.21.5 (pre-1.21.6 GUI rework)
minecraft_version=1.21.5
# Supported MC range (jar name: <mod>-<loader>-<version>+mc<range>.jar)
minecraft_range=1.21-1.21.5

# Build plugins (Architectury template; dev.architectury.loom for <=1.21.8)
arch_plugin_version=3.4.164
arch_loom_version=1.11.454
shadow_version=9.5.1

# Fabric
loader_version=0.18.3
fabric_version=0.128.2+1.21.5

# NeoForge (1.21.5 platform; not needed for the Fabric instance)
neoforge_version=21.5.95

# Mod Properties
mod_version=1.1.1
maven_group=de.dennisthegamer.shulkersorter
archives_base_name=shulkersorter

# Dependencies
architectury_version=16.1.4
modmenu_version=14.0.2
# Compile-only API (not bundled). Must be built with Loom <=1.11.454 AND use the old
# accessWidener format: 3.8.1 needs Loom 1.13.6, 3.8.2 switched to classTweaker v1 -
# both rejected by arch-loom 1.11.454. 3.7.1+1.21.6 (Loom 1.10.2) is the proven combo;
# runtime uses the installed 3.8.2+1.21.5.
yacl_version=3.7.1+1.21.6
